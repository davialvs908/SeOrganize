<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<div class="user-menu" th:fragment="userMenu (greeting=~{::userGreeting})"
     style="display:flex; align-items:center; gap:10px;">
    <th:block th:replace="${greeting}"/>
    <a class="btn-top btn-ghost" th:href="@{/alterar-senha}">Alterar senha</a>
    <form th:action="@{/sair}" method="post" style="margin:0; display:inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn-top btn-sair">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sair
        </button>
    </form>
</div>

<div class="user-chip" th:fragment="userGreeting" th:if="${usuarioLogado != null}">
    <span class="user-avatar" th:text="${usuarioLogado.iniciais}">SO</span>
    <span class="topbar-greeting" th:text="${usuarioLogado.nome}">Usuário</span>
</div>

</body>
</html>
