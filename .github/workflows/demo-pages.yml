name: Demo do painel (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths: [ 'painel-react/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: painel-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: painel-react/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: painel-react/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
