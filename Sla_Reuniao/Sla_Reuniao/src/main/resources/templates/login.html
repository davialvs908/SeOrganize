<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SeOrganize · Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg, #f3f4f6);
            color: var(--ink, #0f1117);
        }

        .topbar {
            background: var(--ink, #0f1117);
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .topbar-logo {
            width: 32px;
            height: 32px;
            background: var(--accent, #22c55e);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .topbar-logo svg { width: 18px; height: 18px; }

        .topbar-name {
            font-family: 'DM Serif Display', serif;
            font-size: 1.15rem;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .topbar-sep {
            width: 1px;
            height: 18px;
            background: rgba(255,255,255,.15);
            margin: 0 12px;
        }

        .topbar-section {
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255,255,255,.5);
        }

        .login-wrap {
            min-height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem 2.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--surface, #fff);
            border: 1px solid var(--border, #e5e7eb);
            border-radius: 12px;
            padding: 1.75rem 1.75rem 1.5rem;
        }

        .login-card h1 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin: 0 0 0.3rem;
        }

        .login-card .subtitle {
            font-size: 0.9rem;
            color: var(--ink-muted, #6b7280);
            margin: 0 0 1.5rem;
            line-height: 1.45;
        }

        .error-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 11px 13px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            line-height: 1.4;
        }

        .error-box svg { flex-shrink: 0; margin-top: 1px; }

        .field { margin-bottom: 1.1rem; }

        .field label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.35rem;
        }

        .input-wrap { position: relative; }

        .field input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border, #e5e7eb);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9375rem;
            color: var(--ink, #0f1117);
            background: var(--surface, #fff);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .field input.has-eye { padding-right: 46px; }

        .field input:focus {
            border-color: #111827;
            box-shadow: 0 0 0 3px rgba(15,17,23,.08);
        }

        .btn-submit {
            width: 100%;
            padding: 11px 14px;
            margin-top: 0.2rem;
            background: #111827;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }

        .btn-submit:hover { background: #1f2937; }
        .btn-submit:disabled { opacity: .7; cursor: wait; }

        .btn-inner {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-note {
            font-size: 0.8rem;
            color: var(--ink-muted, #6b7280);
            line-height: 1.5;
            margin: 1.15rem 0 0;
        }

        .login-legal {
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: #9ca3af;
        }

        @media (max-width: 640px) {
            .topbar { padding: 0 1.1rem; }
            .login-card { padding: 1.4rem 1.2rem 1.25rem; }
        }
    </style>
</head>
<body>

<nav class="topbar">
    <a class="topbar-brand" href="/" aria-label="SeOrganize">
        <div class="topbar-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0f1117" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
        </div>
        <span class="topbar-name">SeOrganize</span>
        <div class="topbar-sep"></div>
        <span class="topbar-section">Acesso</span>
    </a>
</nav>

<main class="login-wrap">
    <div class="login-card">
        <h1>Entrar</h1>
        <p class="subtitle">Use o e-mail e a senha da sua conta.</p>

        <div th:if="${erro != null}" class="error-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span th:text="${erro}"></span>
        </div>

        <form th:action="@{/fazer-login}" method="POST" data-loading-label="Entrando…">
            <div class="field">
                <label for="email">E-mail corporativo</label>
                <div class="input-wrap">
                    <input type="email" id="email" name="email" required autocomplete="email" autofocus spellcheck="false">
                </div>
            </div>

            <div class="field">
                <label for="senha">Senha</label>
                <div class="input-wrap">
                    <input type="password" id="senha" name="senha" class="has-eye" required autocomplete="current-password">
                    <button type="button" class="btn-eye" data-toggle-password="senha" aria-label="Mostrar senha" aria-pressed="false">
                        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnEntrar">
                <span class="btn-inner">Entrar</span>
            </button>
        </form>

        <p class="login-note">Sem acesso? Peça ao administrador da sua unidade.</p>
    </div>

    <p class="login-legal">&copy; 2026 SeOrganize</p>
</main>

<script src="/js/ui.js" th:src="@{/js/ui.js}"></script>
</body>
</html>
