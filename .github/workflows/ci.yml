name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: Testes do back-end (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sla_Reuniao/Sla_Reuniao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Rodar testes
        run: mvn -B test

  painel:
    name: Build do painel React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: painel-react/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
