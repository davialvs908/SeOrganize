<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SeOrganize · Alterar senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --ink: #0f1117; --ink-muted: #6b7280; --surface: #ffffff; --bg: #f3f4f6;
            --accent: #22c55e; --accent-dim: #16a34a; --blue: #3b82f6; --blue-dim: #2563eb;
            --border: #e5e7eb; --fg-green: rgba(34,197,94,.25);
            --err-bg: #fef2f2; --err-txt: #b91c1c; --err-bdr: #fecaca;
            --ok-bg: #f0fdf4; --ok-txt: #15803d; --ok-bdr: #bbf7d0;
        }
        body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }

        .topbar { background:var(--ink); padding:0 2rem; height:60px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
        .topbar-brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; cursor:pointer; }
        .topbar-logo { width:32px; height:32px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; }
        .topbar-logo svg { width:18px; height:18px; }
        .topbar-name { font-family:'DM Serif Display',serif; font-size:1.15rem; color:#fff; letter-spacing:-.3px; }
        .topbar-sep { width:1px; height:18px; background:rgba(255,255,255,.15); margin:0 12px; }
        .topbar-section { font-size:.8rem; font-weight:500; color:rgba(255,255,255,.5); text-transform:none; letter-spacing:0; }
        .topbar-right { display:flex; align-items:center; gap:10px; }
        .user-chip { display:flex; align-items:center; gap:8px; padding-right:10px; border-right:1px solid rgba(255,255,255,.12); }
        .topbar-greeting { font-size:.8rem; color:rgba(255,255,255,.7); max-width:140px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .user-avatar { width:28px; height:28px; border-radius:50%; background:#1f2937; color:#e5e7eb; font-size:.68rem; font-weight:600; display:inline-flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.12); }
        .btn-top { display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:.82rem; font-weight:600; cursor:pointer; text-decoration:none; border:none; transition:background .15s; }
        .btn-top svg { width:14px; height:14px; }
        .btn-kanban { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.15); }
        .btn-kanban:hover { background:rgba(255,255,255,.18); }
        .btn-sair { background:rgba(239,68,68,.15); color:#fca5a5; border:1px solid rgba(239,68,68,.25); }
        .btn-sair:hover { background:rgba(239,68,68,.25); }
        .topbar-right form { margin:0; display:flex; }

        .main { max-width:520px; margin:0 auto; padding:2rem 1.5rem 4rem; }
        .page-header { margin-bottom:2rem; }
        .page-header h1 { font-family:'DM Serif Display',serif; font-size:1.8rem; color:var(--ink); letter-spacing:-.4px; }
        .page-header p { font-size:.9rem; color:var(--ink-muted); margin-top:.25rem; }

        .alert { display:flex; align-items:flex-start; gap:10px; padding:14px 16px; border-radius:10px; font-size:.875rem; font-weight:500; margin-bottom:1.5rem; }
        .alert svg { flex-shrink:0; margin-top:1px; }
        .alert-danger  { background:var(--err-bg); color:var(--err-txt); border:1px solid var(--err-bdr); }
        .alert-success { background:var(--ok-bg);  color:var(--ok-txt);  border:1px solid var(--ok-bdr); }

        .card { background:var(--surface); border-radius:16px; border:1px solid var(--border); padding:1.75rem; }
        .card-title { display:flex; align-items:center; gap:10px; font-size:1rem; font-weight:600; color:var(--ink); padding-bottom:1rem; margin-bottom:1.5rem; border-bottom:1px solid var(--border); }
        .card-title .icon { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .icon-green { background:#dcfce7; } .icon-green svg { color:var(--accent-dim); }
        .card-title svg { width:18px; height:18px; }

        .field { margin-bottom:1.1rem; }
        .field label { display:block; font-size:.8rem; font-weight:500; color:#4b5563; margin-bottom:.4rem; text-transform:none; letter-spacing:0; }
        .field input { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:9px; font-family:'DM Sans',sans-serif; font-size:.9rem; color:var(--ink); background:var(--surface); outline:none; transition:border-color .15s,box-shadow .15s; }
        .field input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--fg-green); }
        .input-wrap { position:relative; }
        .field input.has-eye { padding-right:46px; }
        .hint { font-size:.75rem; color:var(--ink-muted); margin-top:.35rem; line-height:1.4; }

        .btn-main { width:100%; padding:12px; border:none; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:.92rem; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:.25rem; transition:background .15s; }
        .btn-main svg { width:16px; height:16px; }
        .btn-green { background:var(--accent); color:#0f1117; } .btn-green:hover { background:var(--accent-dim); color:#fff; }
        .btn-main:disabled { opacity:.7; cursor:wait; }

        @media (max-width: 640px) {
            .topbar { padding: 0 1.1rem; }
            .main { padding: 1.5rem 1.1rem 3rem; }
        }
    </style>
</head>
<body>

<nav class="topbar">
    <a class="topbar-brand" href="/" aria-label="Voltar ao início">
        <div class="topbar-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0f1117" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
        </div>
        <span class="topbar-name">SeOrganize</span>
        <div class="topbar-sep"></div>
        <span class="topbar-section">Conta</span>
    </a>
    <div class="topbar-right">
        <div class="user-chip" th:if="${usuarioLogado != null}">
            <span class="user-avatar" th:text="${usuarioLogado.iniciais}">SO</span>
            <span class="topbar-greeting" th:text="${usuarioLogado.nome}">Usuário</span>
        </div>
        <a th:if="${usuarioLogado != null and usuarioLogado.admin}" th:href="@{/admin}" class="btn-top btn-kanban">Voltar</a>
        <a th:if="${usuarioLogado != null and usuarioLogado.perfil == 'RECEPCAO'}" th:href="@{/recepcao}" class="btn-top btn-kanban">Voltar</a>
        <a th:if="${usuarioLogado != null and !usuarioLogado.admin and usuarioLogado.perfil != 'RECEPCAO'}" th:href="@{/usuario}" class="btn-top btn-kanban">Voltar</a>
        <a th:href="@{/kanban}" class="btn-top btn-kanban">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            Kanban
        </a>
        <form th:action="@{/sair}" method="POST">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-top btn-sair">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sair
            </button>
        </form>
    </div>
</nav>

<main class="main">

    <div class="page-header">
        <h1>Alterar senha</h1>
        <p>Informe a senha atual e escolha uma nova.</p>
    </div>

    <div th:if="${senhaErro != null or param.containsKey('senhaErro')}" class="alert alert-danger">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span th:text="${senhaErro != null ? senhaErro : (param.containsKey('senhaErro') and !#strings.isEmpty(param.senhaErro[0]) ? param.senhaErro[0] : 'Não foi possível alterar a senha.')}">Não foi possível alterar a senha.</span>
    </div>
    <div th:if="${senhaOk != null or param.containsKey('senhaOk')}" class="alert alert-success">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        <span th:text="${senhaOk != null ? senhaOk : (param.containsKey('senhaOk') and !#strings.isEmpty(param.senhaOk[0]) ? param.senhaOk[0] : 'Senha alterada.')}">Senha alterada.</span>
    </div>

    <div class="card">
        <div class="card-title">
            <div class="icon icon-green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            Nova senha
        </div>
        <form th:action="@{/alterar-senha}" method="POST" data-loading-label="Salvando…">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="field">
                <label for="senhaAtual">Senha atual</label>
                <div class="input-wrap">
                    <input type="password" id="senhaAtual" name="senhaAtual" class="has-eye" required autocomplete="current-password" autofocus>
                    <button type="button" class="btn-eye" data-toggle-password="senhaAtual" aria-label="Mostrar senha" aria-pressed="false">
                        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="senhaNova">Nova senha</label>
                <div class="input-wrap">
                    <input type="password" id="senhaNova" name="senhaNova" class="has-eye" required minlength="8" autocomplete="new-password">
                    <button type="button" class="btn-eye" data-toggle-password="senhaNova" aria-label="Mostrar senha" aria-pressed="false">
                        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                        </svg>
                    </button>
                </div>
                <p class="hint">Mínimo 8 caracteres.</p>
            </div>

            <div class="field">
                <label for="senhaConfirmacao">Confirmar nova senha</label>
                <div class="input-wrap">
                    <input type="password" id="senhaConfirmacao" name="senhaConfirmacao" class="has-eye" required minlength="8" autocomplete="new-password">
                    <button type="button" class="btn-eye" data-toggle-password="senhaConfirmacao" aria-label="Mostrar senha" aria-pressed="false">
                        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-main btn-green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                Salvar senha
            </button>
        </form>
    </div>

</main>

<script src="/js/ui.js" th:src="@{/js/ui.js}"></script>
</body>
</html>
